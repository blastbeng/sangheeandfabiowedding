<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <title>Sang Hee &amp; Fabio - 16/05/2026 - Costigliole D'Asti</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Fallback if React fails to load -->
    <div id="js-fallback" style="display:none; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#fef2f2; font-family:system-ui, sans-serif;">
      <div style="text-align:center; padding:2rem; max-width:400px;">
        <h1 style="font-size:1.5rem; color:#dc2626; margin-bottom:1rem;">Something went wrong</h1>
        <p style="color:#4b5563; margin-bottom:1.5rem;">
          The application could not be loaded. You will be redirected to the home page shortly.
        </p>
        <button onclick="window.location.href='/'" style="background:#dc2626; color:white; border:none; padding:0.75rem 1.5rem; border-radius:0.375rem; cursor:pointer; font-size:1rem;">
          Go to Home Now
        </button>
      </div>
    </div>
    <script>
      // Show fallback if React hasn't rendered after 8 seconds
      (function() {
        var fallback = document.getElementById('js-fallback');
        var root = document.getElementById('root');
        var shown = false;
        var timer = setTimeout(function() {
          if (!root || root.children.length === 0) {
            fallback.style.display = 'flex';
            shown = true;
            // Auto-redirect after 5 more seconds
            setTimeout(function() {
              window.location.href = '/';
            }, 5000);
          }
        }, 8000);

        // If React mounts, hide the fallback and clear the timer
        var observer = new MutationObserver(function() {
          if (root && root.children.length > 0 && !shown) {
            clearTimeout(timer);
            fallback.style.display = 'none';
            observer.disconnect();
          }
        });
        if (root) {
          observer.observe(root, { childList: true });
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
