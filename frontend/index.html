<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <link rel="icon" type="image/x-icon" href="/static/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png">
    <link rel="manifest" href="/static/favicon/site.webmanifest">
    <meta name="theme-color" content="#ffffff">
    <title>Sang Hee &amp; Fabio - 16/05/2026 - Costigliole D'Asti</title>
  </head>
  <body>
    <!-- Loading spinner – visible until React mounts -->
    <div id="initial-loader" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#fdf2f8; display:flex; align-items:center; justify-content:center; z-index:9999;">
      <div style="text-align:center;">
        <div style="font-size:3rem;">💕</div>
        <p style="color:#ec4899; font-family:Georgia,serif; font-size:1.2rem;">Loading...</p>
      </div>
    </div>

    <div id="root"></div>

    <script>
      // Hide the loader when React renders into #root
      (function() {
        var loader = document.getElementById('initial-loader');
        var root = document.getElementById('root');
        if (!loader || !root) return;
        var observer = new MutationObserver(function() {
          if (root.children.length > 0) {
            loader.style.display = 'none';
            observer.disconnect();
          }
        });
        observer.observe(root, { childList: true });
        // Fallback: hide after 10 seconds if React never mounts
        setTimeout(function() {
          if (loader.style.display !== 'none') {
            loader.style.display = 'none';
          }
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
