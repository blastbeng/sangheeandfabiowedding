---
services:
  db:
    image: postgres:15-alpine
    container_name: wedding-db
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network

  web:
    image: "blastbeng/sangheeandfabiowedding-backend:1.0.0"
    pull_policy: build
    build: ./backend
    container_name: wedding-backend
    privileged: true
    command:
      - sh
      - -c
      - |
        python manage.py migrate &&
        python manage.py create_default_admin &&
        python manage.py create_social_apps &&
        exec gunicorn config.wsgi:application --bind 0.0.0.0:8032
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./backend/media:/app/media
      - models_data:/app/models
    environment:
      - PUID=1000
      - PGID=1000
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=${DEBUG}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=6379
      - TIME_ZONE=Europe/Rome
      - DEFAULT_LANGUAGE=it
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - FRONTEND_URL=${FRONTEND_URL}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - EMAIL_BACKEND=${EMAIL_BACKEND}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET}
      - INSTAGRAM_APP_ID=${INSTAGRAM_APP_ID}
      - INSTAGRAM_APP_SECRET=${INSTAGRAM_APP_SECRET}
      - NEXTCLOUD_URL=${NEXTCLOUD_URL}
      - NEXTCLOUD_USERNAME=${NEXTCLOUD_USERNAME}
      - NEXTCLOUD_PASSWORD=${NEXTCLOUD_PASSWORD}
      - NEXTCLOUD_FOLDER=${NEXTCLOUD_FOLDER}
      - LOG_LEVEL=${LOG_LEVEL}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(5); s.connect(('localhost', 8032)); s.close()\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis-dummy-wedding:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  celery:
    image: "blastbeng/sangheeandfabiowedding-backend:1.0.0"
    pull_policy: never
    container_name: wedding-celery
    command: sh -c "/usr/local/bin/download_fonts.sh; /usr/local/bin/download_models.sh; celery -A config worker --loglevel=info"
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./backend/media:/app/media
      - models_data:/app/models
      - huggingface_cache:/root/.cache/huggingface
      - fonts_data:/app/fonts
    environment:
      - PUID=1000
      - PGID=1000
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=${DEBUG}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=6379
      - TIME_ZONE=Europe/Rome
      - DEFAULT_LANGUAGE=it
      - FRONTEND_URL=${FRONTEND_URL}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - EMAIL_BACKEND=${EMAIL_BACKEND}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - NEXTCLOUD_URL=${NEXTCLOUD_URL}
      - NEXTCLOUD_USERNAME=${NEXTCLOUD_USERNAME}
      - NEXTCLOUD_PASSWORD=${NEXTCLOUD_PASSWORD}
      - NEXTCLOUD_FOLDER=${NEXTCLOUD_FOLDER}
    depends_on:
      db:
        condition: service_healthy
      redis-dummy-wedding:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery-beat:
    image: "blastbeng/sangheeandfabiowedding-backend:1.0.0"
    pull_policy: never
    container_name: wedding-celery-beat
    command: celery -A config beat --loglevel=info
    volumes:
      - models_data:/app/models
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - PUID=1000
      - PGID=1000
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=${DEBUG}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=6379
      - TIME_ZONE=Europe/Rome
      - DEFAULT_LANGUAGE=it
      - FRONTEND_URL=${FRONTEND_URL}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - NEXTCLOUD_URL=${NEXTCLOUD_URL}
      - NEXTCLOUD_USERNAME=${NEXTCLOUD_USERNAME}
      - NEXTCLOUD_PASSWORD=${NEXTCLOUD_PASSWORD}
      - NEXTCLOUD_FOLDER=${NEXTCLOUD_FOLDER}
    depends_on:
      db:
        condition: service_healthy
      redis-dummy-wedding:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys,glob; sys.exit(0 if any('beat' in open(f,'rb').read().decode('utf-8','ignore') for f in glob.glob('/proc/[0-9]*/cmdline')) else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: "blastbeng/sangheeandfabiowedding-frontend:1.0.0"
    pull_policy: build
    container_name: wedding-frontend
    build:
      context: ./frontend
      args:
        - VITE_API_URL=
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    command: node health-server.cjs
    environment:
      - VITE_API_URL=
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
      - VITE_DEFAULT_LANGUAGE=it
      - VITE_SUPPORTED_LANGUAGES=it,ko,en
      - VITE_LOG_LEVEL=${VITE_LOG_LEVEL}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect(5173, 'localhost').on('connect', () => process.exit(0)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: wedding-nginx
    ports:
      - "5232:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/media:/app/media:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      web:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
  redis-dummy-wedding:
    image: alpine
    container_name: redis-dummy-wedding
    command: sh -c "until nc -z 192.168.1.13 6379; do echo 'Waiting for redis...'; sleep 2; done; echo 'Redis found!'; sleep infinity"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 192.168.1.13 6379"]
      interval: 30s
      timeout: 5s
      retries: 12

networks:
  app-network:
    driver: bridge

volumes:
  models_data:
  huggingface_cache:
  fonts_data:
